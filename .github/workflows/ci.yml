name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development environment
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Check style
        run: |
          ruff check .
          ruff format --check .
          bandit -r core simulation analysis main.py -c pyproject.toml -q
      - name: Test offline
        run: python -m pytest --benchmark-disable
      - name: Verify published evaluation
        run: python -m scripts.export_evaluation --verify
      - name: Build and smoke-test installed wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m venv /tmp/parking-wheel
          /tmp/parking-wheel/bin/python -m pip install -r requirements-dev.txt
          /tmp/parking-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          cd /tmp
          /tmp/parking-wheel/bin/parking-optimize --mode demo --zones 3 --drivers 5 --duration 0.25 --seed 42
          /tmp/parking-wheel/bin/parking-optimize --mode compare --zones 2 --drivers 5 --duration 0.25 --seeds 1,2 --policies static-distance,dynamic-time
          /tmp/parking-wheel/bin/python -c "from pathlib import Path; import simulation.dashboard as dashboard; assert Path(dashboard.__file__).with_name('dashboard.html').is_file()"
