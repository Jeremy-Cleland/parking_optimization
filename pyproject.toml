[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-optimization"
version = "1.0.0"
description = "Real-Time Collaborative Parking Space Optimization System"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Parking Optimization Team", email = "jdcl@umich.edu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "networkx>=3.0",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "folium>=0.12.0",
    "scikit-learn>=1.0.0",
    "requests>=2.25.0",
    "pydantic>=2.0.0",
    "python-dotenv>=0.19.0",
    "osmnx>=1.0.0",
    "geopandas>=0.10.0",
    "rtree>=1.0.0",
]

[project.optional-dependencies]
apple = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "memory-profiler>=0.60.0",
    "bandit>=1.7.0",
    "types-requests>=2.25.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-benchmark>=4.0.0",
]

[project.scripts]
parking-optimize = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "simulation*", "analysis*"]
exclude = [
    "tests*",
    "logs*",
    "cache*",
    "output*",
    "visualization_output*",
    "htmlcov*",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.package-data]
simulation = ["dashboard.html"]

[project.urls]
Homepage = "https://jeremy-cleland.github.io/parking_optimization/"
Documentation = "https://github.com/Jeremy-Cleland/parking_optimization#readme"
Repository = "https://github.com/Jeremy-Cleland/parking_optimization.git"
"Bug Tracker" = "https://github.com/jeremy-cleland/parking-optimization/issues"

# ============================================================================
# TOOL CONFIGURATIONS
# ============================================================================

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff specific
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "B006", # do not use mutable default arguments
    "UP006", # preserve legacy typing style during Python support correction
    "UP035",
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F811", "E402"]
"scripts/*.py" = ["E402"]
"analysis/complexity_analysis.py" = ["E402"]
"simulation/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["core", "simulation", "analysis"]

[tool.mypy]
python_version = "3.13"
exclude = ["^build/", "^dist/", "^\\.venv/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "folium.*",
    "matplotlib.*",
    "seaborn.*",
    "osmnx.*",
    "geopandas.*",
    "rtree.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "--cov=core",
    "--cov=simulation",
    "--cov=analysis",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["core", "simulation", "analysis"]
omit = ["tests/*", "*/test_*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
